name: Publish Release

on:
  pull_request:
    branches: [develop]
    types: [closed]
  push:
    branches: [develop]

jobs:
  publish:
    permissions:
      contents: write        # tag + GitHub release, delete abandoned branches
      pull-requests: write   # GITHUB_TOKEN approves the next-SNAPSHOT PR
    uses: secure-software-engineering/actions/.github/workflows/maven-release-publish.yml@c98577761faae44108ba0ec2de7ebd67ddd4b40b # develop
    with:
      head_branch: develop
      java_version: '11'
      release_java_distribution: adopt
      deployment_environment: Deploy
      maven_deploy_args: '-DskipTests -Pdeployment'
    secrets:
      release_pat: ${{ secrets.AUTO_MERGE_PAT }}
      gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
      gpg_passphrase: ${{ secrets.GPG_PRIVATE_KEY_PASSPHRASE }}
      maven_username: ${{ secrets.SONATYPE_USER }}
      maven_central_token: ${{ secrets.SONATYPE_PW }}
