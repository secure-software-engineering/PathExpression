    uses: secure-software-engineering/actions/.github/workflows/maven-release-title-sync.yml@c98577761faae44108ba0ec2de7ebd67ddd4b40b # develop
    with:
      java_version: '11'
    secrets:
      release_pat: ${{ secrets.AUTO_MERGE_PAT }}
